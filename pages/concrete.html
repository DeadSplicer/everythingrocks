<body>
  <div id="header">
    <h1>
      <img src="../images/misc_icons/logo.png" height=auto width=50px id="logo">
      <a href="../index.html" class="button2">EVERYTHING ROCKS</a>
      <p class="subtext">Masonry Company</p>
    </h1>

  </div>

  <div class="menu_button">
    Menu
  </div>

  <!-- IF mobile, change div id to mobilemenu and class to mobilebutton & vice versa -->
  <div id="desktopMenu" class="center">
    <a href="../index.html" class="button">Home</a>
    <a href="rocks.html" class="button">Rocks</a>
    <a href="#" class="button" id="active">Concrete</a>
    <a href="brick.html" class="button">Brick</a>
    <a href="stucco.html" class="button">Stucco</a>
    <a href="video.html" class="button">Videos</a>
  </div>

  <div class="container">
    <div class="row" id="gallery">
      <p id="gallery-msg" style="padding:20px;width:100%;text-align:center;">Loading images...</p>
    </div>
  </div>

  <div id="center">
    <a href='#top' id="toTopText">Back to Top</a>
  </div>

  <script type="text/javascript" src="../java/mobileDetector.js"></script>
  <script type="text/javascript" src="../java/easing.js"></script>
  <script type="text/javascript" src="../java/lightbox.min.js"></script>

  <script>
    fetch('https://api.github.com/repos/DeadSplicer/everythingrocks/contents/images/concrete')
      .then(function(res) { return res.json(); })
      .then(function(files) {
        var images = files
          .filter(function(f) { return f.type === 'file' && /\.(jpg|jpeg)$/i.test(f.name); })
          .sort(function(a, b) { return a.name.localeCompare(b.name); });

        var html = '';
        images.forEach(function(img) {
          var path = '../images/concrete/' + img.name;
          html += '<div class="col-xs-12 col-sm-6 col-lg-3">' +
            '<a href="' + path + '" data-lightbox="img_g" class="thumbnail">' +
            '<img src="' + path + '" alt="" loading="lazy">' +
            '</a></div>';
        });

        var gallery = document.getElementById('gallery');
        gallery.innerHTML = html || '<p style="padding:20px;width:100%;text-align:center;">No images found.</p>';
      })
      .catch(function() {
        document.getElementById('gallery').innerHTML =
          '<p style="padding:20px;width:100%;text-align:center;">Unable to load images. Please try again later.</p>';
      });
  </script>

</body>
